<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Logic terrain generator</title>
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#17262f;--mute:#5d707b;--line:#c9d4da;--acc:#1f6f8b;--ok:#2f7d4f;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#10191e;--panel:#18252c;--ink:#e3ecf0;--mute:#8fa3ad;--line:#2b3d46;--acc:#5fb4d1;--ok:#6cc58f;--bad:#ef8077}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.8rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 22px;color:var(--mute);max-width:60ch}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
label{display:flex;justify-content:space-between;font:14px system-ui,sans-serif;margin:12px 0 2px}
label b{font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number],select{width:100%;padding:6px;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:600 14px system-ui,sans-serif;padding:9px 14px;border-radius:4px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
canvas{width:100%;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px;background:var(--bg);aspect-ratio:1}
textarea{width:100%;height:110px;margin-top:10px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}
.stats{font:14px system-ui,sans-serif;color:var(--mute);margin:10px 0 0}
.warn{color:var(--bad)}
#test{font:13px system-ui,sans-serif;margin-top:16px;color:var(--mute)}
#test .ok{color:var(--ok)}#test .bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Build Logic terrain generator</h1>
<p class="sub">Makes hills out of stacked blocks and gives you a save string to paste into the game. Everything runs in your browser.</p>
<div class="grid">
<section class="card" aria-label="Settings">
<label for="w">Width (x) <b id="wv"></b></label><input id="w" type="range" min="4" max="256" value="64">
<label for="d">Depth (y) <b id="dv"></b></label><input id="d" type="range" min="4" max="256" value="64">
<label for="hm">Max height <b id="hv"></b></label><input id="hm" type="range" min="1" max="15" value="10">
<label for="wl">Water level <b id="wlv"></b></label><input id="wl" type="range" min="0" max="15" value="2">
<label for="zo">Raise terrain <b id="zov"></b></label><input id="zo" type="range" min="0" max="5" value="0">
<label for="cm">Colors</label>
<select id="cm"><option value="biome">Biomes</option><option value="height">Height gradient only</option></select>
<label for="bs">Biome size <b id="bsv"></b></label><input id="bs" type="range" min="10" max="120" value="50">
<label for="tr">Trees <b id="trv"></b></label><input id="tr" type="range" min="0" max="200" value="100">
<label for="sc">Hill size <b id="sv"></b></label><input id="sc" type="range" min="3" max="40" value="14">
<label for="oc">Roughness <b id="ov"></b></label><input id="oc" type="range" min="1" max="5" value="3">
<label for="seed">Seed</label>
<div class="row"><input id="seed" type="number" value="1234"><button class="alt" id="rnd" type="button">Random</button></div>
<label for="fill">Fill</label>
<select id="fill"><option value="skin">Surface only (fewer blocks)</option><option value="solid">Solid down to ground</option></select>
<label>Start position (x, y)</label>
<div class="row"><button class="alt" id="whole" type="button">Whole map (256 x 256)</button></div>
<div class="row" style="margin-top:8px"><input id="ox" type="number" value="100" min="0" max="255" aria-label="Start x"><input id="oy" type="number" value="100" min="0" max="255" aria-label="Start y"></div>
</section>
<section class="card" aria-label="Result">
<canvas id="cv" width="64" height="64" aria-label="Top-down height preview"></canvas>
<div class="stats" id="stats"></div>
<textarea id="out" readonly aria-label="Save string"></textarea>
<div class="row" style="margin-top:10px"><button id="copy" type="button">Copy save string</button><button class="alt" id="gen" type="button">Regenerate</button><button class="alt" id="dl" type="button">Download .txt</button></div>
<div id="test"></div>
</section>
</div>
</main>
<script>
// Save string format, reverse-engineered from samples (block id 43 only).
// Entry = 'G' + 5 chars + optional 4 color chars. 6 bits per char, lowest bits first.
// x = bits 6-13, height = bits 14-17, y = bits 22-29 (x,y 0-255, height 0-15).
// Color = 3 bytes (R,G,B) packed little-endian into the 4 chars after the first 6.
const AL="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789#$";
function chars(v,n){let s="";for(let i=0;i<n;i++){s+=AL[v%64];v=Math.floor(v/64)}return s}
function enc(x,y,h,rgb){
  let s=chars(6+x*64+h*16384+y*4194304,6);
  if(rgb)s+=chars(rgb[0]+rgb[1]*256+rgb[2]*65536,4);
  return s;
}
function hash(a,b,s){let t=(a*374761393+b*668265263+s*1274126177)|0;t=Math.imul(t^(t>>>13),1274126177);return((t^(t>>>16))>>>0)/4294967296}
const sm=t=>t*t*(3-2*t);
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
function field(W,D,scale,oct,seed){
  const m=[];let lo=1e9,hi=-1e9;
  for(let j=0;j<D;j++){m.push([]);for(let i=0;i<W;i++){
    let amp=1,f=1,sum=0,norm=0;
    for(let o=0;o<oct;o++){sum+=amp*vnoise(i/scale*f,j/scale*f,seed+o*101);norm+=amp;amp*=.5;f*=2}
    const n=sum/norm;m[j].push(n);lo=Math.min(lo,n);hi=Math.max(hi,n)}}
  return m.map(r=>r.map(n=>(n-lo)/((hi-lo)||1)))
}
const RAMP=[[58,128,70],[120,165,82],[198,180,112],[145,105,72],[245,245,245]];
function ramp(t){const p=Math.min(1,Math.max(0,t))*4,a=Math.min(3,Math.floor(p)),f=p-a;return RAMP[a].map((c,n)=>c+(RAMP[a+1][n]-c)*f)}
// [top color, side color]
const BIO={water:[[38,92,160],[38,92,160]],beach:[[226,208,150],[200,182,130]],desert:[[224,198,125],[200,170,100]],
  savanna:[[172,170,80],[130,100,65]],grass:[[95,168,72],[112,82,55]],forest:[[48,120,58],[105,76,50]],
  tundra:[[186,204,198],[120,110,100]],rock:[[128,128,134],[100,100,106]],snow:[[244,247,250],[150,150,158]]};
const TRUNK=[100,70,45],OAK=[52,138,60],SPRUCE=[30,92,70],CACTUS=[58,138,72],CAP=15;
const TREE_P={forest:.07,grass:.012,tundra:.015,savanna:.01,desert:.006};
const $=id=>document.getElementById(id);
function build(){
  const W=+$("w").value,D=+$("d").value,H=+$("hm").value,sc=+$("sc").value,oc=+$("oc").value,seed=+$("seed").value||0;
  const water=+$("wl").value,mode=$("cm").value,bs=+$("bs").value,treeK=+$("tr").value/100;
  const ox=Math.max(0,+$("ox").value|0),oy=Math.max(0,+$("oy").value|0),solid=$("fill").value==="solid";
  $("wv").textContent=W;$("dv").textContent=D;$("hv").textContent=H;$("sv").textContent=sc;$("ov").textContent=oc;$("wlv").textContent=water;$("zov").textContent=$("zo").value;$("bsv").textContent=bs;$("trv").textContent=$("tr").value+"%";
  let m=field(W,D,sc,oc,seed).map(r=>r.map(n=>Math.round(n*H)));
  const wet=m.map(r=>r.map(h=>h<water));
  m=m.map(r=>r.map(h=>Math.max(h,water)));
  const at=(i,j,d)=>(m[j]&&m[j][i]!==undefined)?m[j][i]:d;
  const Tm=field(W,D,bs,2,seed+11),Mo=field(W,D,bs*.8,2,seed+23),ct=v=>Math.min(1,Math.max(0,(v-.5)*1.8+.5));
  const bio=m.map((r,j)=>r.map((h,i)=>{
    if(wet[j][i])return"water";
    const t=H>water?(h-water)/(H-water):0;
    if(water>0&&h<=water)return"beach";
    if(t>.92)return"snow";if(t>.72)return"rock";
    const a=ct(Tm[j][i]),b=ct(Mo[j][i]);
    if(a<.3)return"tundra";if(a>.7)return b<.5?"desert":"savanna";
    return b>.6?"forest":"grass"}));
  const base=water-(+$("zo").value);
  m=m.map(r=>r.map(h=>h-base)); // water surface sits on the ground (z=0)
  function color(i,j,k,top){
    const b=bio[j][i];if(b==="water")return BIO.water[0];
    let c=(mode==="height")?ramp(H?(k+base)/H:0):BIO[b][top?0:1].slice();
    let f=.94+.12*hash(i,j,k+seed);
    if(top){const h=m[j][i];f*=Math.min(1.3,Math.max(.7,1+.08*((at(i-1,j,h)-at(i+1,j,h))+(at(i,j-1,h)-at(i,j+1,h)))))}
    return c.map(v=>Math.max(0,Math.min(255,Math.round(v*f))));
  }
  const cells=new Map(),pv=new Array(W*D),pz=new Int16Array(W*D).fill(-1);
  function put(i,j,z,c,keep){
    const x=ox+i,y=oy+j;if(x<0||y<0||x>255||y>255||z<0||z>CAP)return;
    const key=(x*256+y)*64+z;if(keep&&cells.has(key))return;
    cells.set(key,[x,y,z,c]);
    if(i>=0&&i<W&&j>=0&&j<D&&z>=pz[j*W+i]){pz[j*W+i]=z;pv[j*W+i]=c}
  }
  for(let j=0;j<D;j++)for(let i=0;i<W;i++){
    const h=m[j][i];let from=0;
    // only blocks with an exposed side: start one above the lowest neighbour
    if(!solid)from=Math.max(0,Math.min(h,Math.min(at(i-1,j,-1),at(i+1,j,-1),at(i,j-1,-1),at(i,j+1,-1))+1));
    for(let k=from;k<=h;k++)put(i,j,k,color(i,j,k,k===h));
  }
  let trees=0;
  const hs=(i,j,n)=>hash(i,j,seed+n);
  for(let j=1;j<D-1;j++)for(let i=1;i<W-1;i++){
    const b=bio[j][i],pr=TREE_P[b];if(!pr||hs(i,j,7)>=pr*treeK)continue;
    const h=m[j][i],tall=hs(i,j,9)>.5?1:0;
    if(b==="desert"){const n=2+tall;if(h+n>CAP)continue;for(let z=1;z<=n;z++)put(i,j,h+z,CACTUS);trees++;continue}
    const tr=4+tall;if(h+tr+1>CAP)continue;
    const leaf=b==="tundra"?SPRUCE:OAK;
    for(let z=1;z<=tr-2;z++)put(i,j,h+z,TRUNK); // trunk stops where the leaves hide it
    for(const dz of [tr-1,tr])for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)
      if((dx||dy)&&h+dz>at(i+dx,j+dy,0))put(i+dx,j+dy,h+dz,leaf,true);
    for(const[dx,dy]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]])put(i+dx,j+dy,h+tr+1,leaf,true);
    trees++;
  }
  const cv=$("cv");cv.width=W;cv.height=D;const g=cv.getContext("2d"),im=g.createImageData(W,D);
  for(let n=0;n<W*D;n++){const c=pv[n]||[40,40,40],o=n*4;im.data[o]=c[0];im.data[o+1]=c[1];im.data[o+2]=c[2];im.data[o+3]=255}
  g.putImageData(im,0,0);
  const str=[...cells.values()].map(v=>enc(v[0],v[1],v[2],v[3])).join(";");$("out").value=str;
  const over=ox+W>256||oy+D>256;
  $("stats").innerHTML=cells.size.toLocaleString()+" blocks, "+trees.toLocaleString()+" trees, "+str.length.toLocaleString()+" characters"+
    (over?'<br><span class="warn">Start position plus size goes past 255. Lower the start x or y.</span>':"")+
    (cells.size>50000?'<br><span class="warn">Very large. If the game will not import it, shrink the area or use surface only.</span>':"")+
    (H-base+5>CAP?'<br><span class="warn">Trees only grow where there is room under the height limit of 15, so tall hills have none.</span>':"");
}
function selftest(){
  const cases=[[118,135,0,null,"G2BwhA"],[118,135,2,null,"G2JwhA"],[120,135,0,null,"G4BwhA"],[115,97,0,null,"GzBQYA"],[115,97,0,[255,0,0],"GzBQYA$DAA"],[114,97,0,[17,45,255],"GyBQYAR0y$"]];
  $("test").innerHTML="Encoder check against your samples: "+cases.map(c=>enc(c[0],c[1],c[2],c[3])===c[4]?'<span class="ok">'+c[4]+' ✓</span>':'<span class="bad">'+c[4]+' ✗</span>').join("  ")
}
["w","d","hm","sc","oc","seed","fill","ox","oy","wl","cm","bs","tr","zo"].forEach(id=>$(id).addEventListener("input",build));
$("gen").onclick=build;
$("whole").onclick=()=>{$("w").value=256;$("d").value=256;$("ox").value=0;$("oy").value=0;build()};
$("rnd").onclick=()=>{$("seed").value=Math.floor(Math.random()*1e6);build()};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("out").value],{type:"text/plain"}));a.download="terrain-save.txt";a.click()};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("out").value);$("copy").textContent="Copied"}catch(e){$("out").select();document.execCommand("copy");$("copy").textContent="Copied"}setTimeout(()=>$("copy").textContent="Copy save string",1500)};
selftest();build();
</script>
</body>
</html>
